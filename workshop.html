                if (hiddenInput) hiddenInput.remove();

                document.getElementById('uploadModalTitle').innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 上传模组';
                document.getElementById('uploadModalSub').innerHTML = '上传作者：<span id="uploadAuthorDisplay" style="color:#ffaa55;">' +
                    getAccountName() + '</span>';
                var authorDisplay = document.getElementById('uploadAuthorDisplay');
                if (authorDisplay) authorDisplay.textContent = getAccountName();

                var form = document.getElementById('uploadForm');
                form.onsubmit = function(e) {
                    e.preventDefault();
                    handleUpload(false, null);
                };
            }

            function openUploadModal(editMode, modData) {
                if (!checkUploadPermission()) return;

                resetUploadForm();

                if (editMode && modData) {
                    isEditingMode = true;
                    editingModId = modData.id;

                    document.getElementById('modName').value = modData.name || '';
                    document.getElementById('modCategory').value = modData.category || 'prop';
                    document.getElementById('modDesc').value = modData.description || '';
                    document.getElementById('modVersion').value = modData.version || '1.0.0';
                    document.getElementById('uploadFileName').textContent = '保持当前文件（可选替换）';
                    document.getElementById('uploadFileName').style.color = '#888';
                    document.getElementById('uploadFileName').style.fontWeight = 'normal';
                    document.getElementById('uploadIconName').textContent = modData.iconUrl ? '当前有图标（可选替换）' : '未选择文件';
                    document.getElementById('uploadPreviewName').textContent = modData.previewUrl ? '当前有预览图（可选替换）' :
                        '未选择文件';
                    document.getElementById('zipRequired').textContent = '（可选）';

                    var hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.id = 'editModIdHidden';
                    hiddenInput.value = modData.id;
                    document.getElementById('uploadForm').appendChild(hiddenInput);

                    document.getElementById('uploadModalTitle').innerHTML = '<i class="fas fa-edit"></i> 编辑模组';
                    document.getElementById('uploadModalSub').innerHTML = '编辑作者：<span id="uploadAuthorDisplay" style="color:#ffaa55;">' +
                        getAccountName() + '</span>';
                    var authorDisplay = document.getElementById('uploadAuthorDisplay');
                    if (authorDisplay) authorDisplay.textContent = getAccountName();

                    document.getElementById('uploadSubmit').innerHTML = '<i class="fas fa-sync-alt"></i> 更新模组';

                    var form = document.getElementById('uploadForm');
                    form.onsubmit = function(e) {
                        e.preventDefault();
                        handleUpload(true, modData.id);
                    };
                }

                openModal('uploadModal');
            }

            function handleUpload(isEdit, editId) {
                var file = selectedFiles.zip || document.getElementById('modFile').files[0];
                var name = document.getElementById('modName').value.trim();
                var category = document.getElementById('modCategory').value;
                var desc = document.getElementById('modDesc').value.trim();
                var version = document.getElementById('modVersion').value.trim() || '1.0.0';
                var iconFile = selectedFiles.icon || document.getElementById('iconFile').files[0];
                var previewFile = selectedFiles.preview || document.getElementById('previewFile').files[0];

                if (!isEdit && !file) {
                    showToast('请选择 ZIP 文件', 'error', '', '<i class="fas fa-file-archive"></i>');
                    return;
                }
                if (!name) {
                    showToast('请输入模组名称', 'error', '', '<i class="fas fa-pencil-alt"></i>');
                    return;
                }

                var author = getAccountName();
                var authorEmail = getAccountEmail();
                var id = editId || ('mod_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));

                var zipPath = 'mods/' + id + '.zip';
                var iconPath = 'icons/' + id + '.png';
                var previewPath = 'previews/' + id + '.jpg';

                var existingMod = null;
                if (isEdit) { existingMod = allMods.find(function(m) { return m.id === id; }); }

                var newMod = {
                    id: id,
                    name: name,
                    author: author,
                    authorEmail: authorEmail,
                    category: category,
                    description: desc || '暂无描述',
                    version: version,
                    fileSize: file ? file.size : (existingMod ? existingMod.fileSize : 0),
                    downloadCount: existingMod ? existingMod.downloadCount : 0,
                    uploadedAt: new Date().toISOString(),
                    downloadUrl: CDN_BASE + '/' + zipPath,
                    iconUrl: iconFile ? CDN_BASE + '/' + iconPath : (existingMod ? existingMod.iconUrl : null),
                    previewUrl: previewFile ? CDN_BASE + '/' + previewPath : (existingMod ? existingMod.previewUrl : null)
                };

                var submitBtn = document.getElementById('uploadSubmit');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (isEdit ? '更新中...' : '上传中...');

                showToast(isEdit ? '正在更新...' : '正在上传...', 'warning', '请稍候', '<i class="fas fa-spinner fa-spin"></i>');

                var chain = Promise.resolve();

                chain = chain.then(function() {
                    return Promise.all([
                        ensureFolderExists('mods'),
                        ensureFolderExists('icons'),
                        ensureFolderExists('previews'),
                        ensureFolderExists('avatars')
                    ]);
                });

                if (file) {
                    chain = chain.then(function() {
                        showProgress('zipProgress', 10);
                        return uploadToGitHubWithProgress(file, zipPath, function(p) { showProgress('zipProgress', p); });
                    });
                } else if (isEdit) {
                    chain = chain.then(function() { showProgress('zipProgress', 100); return Promise.resolve(); });
                }

                if (iconFile) {
                    chain = chain.then(function() {
                        showProgress('iconProgress', 10);
                        return uploadToGitHubWithProgress(iconFile, iconPath, function(p) { showProgress('iconProgress',
                            p); });
                    });
                } else if (isEdit) {
                    chain = chain.then(function() { showProgress('iconProgress', 100); return Promise.resolve(); });
                }

                if (previewFile) {
                    chain = chain.then(function() {
                        showProgress('previewProgress', 10);
                        return uploadToGitHubWithProgress(previewFile, previewPath, function(p) { showProgress(
                                'previewProgress', p); });
                    });
                } else if (isEdit) {
                    chain = chain.then(function() { showProgress('previewProgress', 100); return Promise.resolve(); });
                }

                chain = chain.then(function() { return updateModsJson(newMod); })
                    .then(function() {
                        var waitPromises = [];
                        if (file) { waitPromises.push(waitForGitHubSync(id, 'zip', 10, 1500)); }
                        if (iconFile) { waitPromises.push(waitForGitHubSync(id, 'icon', 8, 1500)); }
                        if (previewFile) { waitPromises.push(waitForGitHubSync(id, 'preview', 8, 1500)); }
                        return Promise.all(waitPromises);
                    })
                    .then(function() {
                        var successMsg = isEdit ? '模组 "' + name + '" 已更新！' : '模组 "' + name + '" 上传成功！';
                        showToast(successMsg, 'success', '正在刷新列表...', '<i class="fas fa-check-circle"></i>');
                        playMenuSound();
                        return scanAllFolders();
                    })
                    .then(function() {
                        return forceRefresh();
                    })
                    .then(function() {
                        applySearch();
                        updateBadges();
                        if (isEdit) { renderMyMods(); }
                        showToast('已切换到 ' + CATEGORY_NAMES[category], 'success', '你的模组已出现在列表中',
                            '<i class="fas fa-rocket"></i>');
                        closeModal('uploadModal');
                    })
                    .catch(function(err) {
                        showToast('失败: ' + err.message, 'error', '请检查 Token 和权限',
                            '<i class="fas fa-exclamation-triangle"></i>');
                        console.error('[Upload Error]', err);
                        fetchMods();
                    });

                chain.finally(function() {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = isEdit ? '<i class="fas fa-sync-alt"></i> 更新模组' :
                        '<i class="fas fa-upload"></i> 上传模组';
                    ['zipProgress', 'iconProgress', 'previewProgress'].forEach(function(id) {
                        var el = document.getElementById(id);
                        if (el) el.classList.remove('active');
                    });
                });
            }

            document.getElementById('uploadBtn').addEventListener('click', function() {
                openUploadModal(false, null);
            });
            document.getElementById('uploadModalClose').addEventListener('click', function() { closeModal('uploadModal'); });
            document.getElementById('uploadCancel').addEventListener('click', function() { closeModal('uploadModal'); });

            var myModsList = document.getElementById('myModsList');

            function renderMyMods() {
                if (!checkMyModsPermission()) return;

                var currentEmail = getAccountEmail();
                var currentName = getAccountName();
                var authorDisplay = document.getElementById('myModsAuthorDisplay');
                if (authorDisplay) { authorDisplay.textContent = currentName; }

                var userMods = allMods.filter(function(m) {
                    return m.authorEmail && m.authorEmail === currentEmail;
                });

                if (userMods.length === 0) {
                    myModsList.innerHTML =
                        `
                        <div class="my-mod-empty">
                            <i class="fas fa-box-open"></i>
                            你还没有上传过模组
                            <br><span style="font-size:0.55rem;color:#555;">点击「上传模组」分享你的作品</span>
                        </div>
                    `;
                    return;
                }

                var html = '';
                for (var i = 0; i < userMods.length; i++) {
                    var mod = userMods[i];
                    var status = getAbnormalStatus(mod);
                    var statusIcon = status ? '<i class="fas ' + status.icon + '" style="color:#ff8844;font-size:0.4rem;margin-right:3px;"></i>' :
                        '';
                    var avatarHtml = getAvatarHtml(mod.authorEmail || null, 18);

                    html += `
                        <div class="my-mod-item" data-id="${mod.id}">
                            <div class="mod-info">
                                <div class="name">${avatarHtml} ${statusIcon}${mod.name}</div>
                                <div class="meta">${CATEGORY_NAMES[mod.category] || mod.category} · v${mod.version || '1.0.0'} · 下载 ${mod.downloadCount || 0} 次</div>
                            </div>
                            <div class="mod-actions">
                                <button class="btn-edit" data-action="edit"><i class="fas fa-edit"></i> 编辑</button>
                                <button class="btn-delete" data-action="delete"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }

                myModsList.innerHTML = html;

                var items = myModsList.querySelectorAll('.my-mod-item');
                for (var i = 0; i < items.length; i++) {
                    (function(item) {
                        var modId = item.getAttribute('data-id');
                        var mod = allMods.find(function(m) { return m.id === modId; });
                        if (!mod) return;

                        var btns = item.querySelectorAll('[data-action]');
                        for (var j = 0; j < btns.length; j++) {
                            (function(btn) {
                                btn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    playMenuSound();

                                    if (btn.getAttribute('data-action') === 'delete') {
                                        if (confirm('确定要删除模组 "' + mod.name + '" 吗？\n此操作将同步删除仓库中的文件！')) {
                                            showToast('正在删除...', 'warning', '请稍候', '<i class="fas fa-spinner fa-spin"></i>');
                                            deleteModFromGitHub(modId)
                                                .then(function() {
                                                    showToast('已删除: ' + mod.name, 'success', '',
                                                        '<i class="fas fa-trash"></i>');
                                                    return scanAllFolders();
                                                })
                                                .then(function() { return forceRefresh(); })
                                                .then(function() {
                                                    renderMyMods();
                                                    applySearch();
                                                    updateBadges();
                                                    closeModal('myModsModal');
                                                    openModal('myModsModal');
                                                })
                                                .catch(function(err) {
                                                    showToast('删除失败: ' + err.message, 'error', '',
                                                        '<i class="fas fa-exclamation-triangle"></i>');
                                                });
                                        }
                                    }

                                    if (btn.getAttribute('data-action') === 'edit') {
                                        closeModal('myModsModal');
                                        setTimeout(function() {
                                            openUploadModal(true, mod);
                                        }, 300);
                                    }
                                });
                            })(btns[j]);
                        }
                    })(items[i]);
                }
            }

            document.getElementById('myModsBtn').addEventListener('click', function() {
                if (!checkMyModsPermission()) return;
                renderMyMods();
                openModal('myModsModal');
            });
            document.getElementById('myModsModalClose').addEventListener('click', function() { closeModal('myModsModal'); });

            function switchCategory(category) {
                if (category === currentCategory) { applySearch(); return; }
                playMenuSound();
                currentCategory = category;
                var btns = document.querySelectorAll('.cat-btn');
                for (var i = 0; i < btns.length; i++) {
                    var btn = btns[i];
                    if (btn.getAttribute('data-category') === category) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
                applySearch();
            }

            searchInput.addEventListener('input', function() {
                applySearch();
                updateBadges();
                updateModCount();
            });
            searchBtn.addEventListener('click', function() {
                applySearch();
                updateBadges();
                updateModCount();
                if (searchInput.value.trim()) {
                    showToast('搜索: "' + searchInput.value.trim() + '"', 'warning', '找到 ' + filteredMods.length +
                        ' 个结果', '<i class="fas fa-search"></i>');
                }
            });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault();
                    searchBtn.click(); }
            });

            document.getElementById('refreshBtn').addEventListener('click', function() { forceRefresh(); });
            document.getElementById('backBtn').addEventListener('click', function() {
                playMenuSound();
                window.location.href = 'menu.html';
            });

            function initWorkshop() {
                console.log('[Workshop] 初始化创意工坊...');
                var btns = document.querySelectorAll('.cat-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            var cat = btn.getAttribute('data-category');
                            switchCategory(cat);
                        });
                    })(btns[i]);
                }

                var playerName = getAccountName();
                console.log('[Workshop] 当前玩家:', playerName);

                if (isGuestMode()) {
                    showToast('游客模式：可浏览下载，但不能上传或管理模组', 'warning', 4000);
                }

                Promise.all([fetchMods(), loadCommentsFromGitHub()])
                    .then(function() {
                        applySearch();
                        updateBadges();
                        updateModCount();
                        console.log('[Workshop] 初始化完成');
                        console.log('CDN:', CDN_BASE);
                        console.log('玩家:', playerName);
                        console.log('模组总数:', allMods.length);
                        console.log('模式:', isGuestMode() ? '游客' : '邮箱用户');
                    })
                    .catch(function(err) {
                        console.error('[Workshop] 初始化失败:', err);
                    });
            }

            function start() {
                var loggedIn = localStorage.getItem('dsmod_logged_in');
                if (loggedIn !== 'true') {
                    showToast('请先登录', 'warning', '', '<i class="fas fa-exclamation-circle"></i>');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1200);
                    return;
                }
                showCheckModal();
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                start();
            } else {
                document.addEventListener('DOMContentLoaded', start);
            }

        })();
    </script>

</body>
</html>
