<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>创意工坊 - DS-MOD★</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 0%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 0%; }
        }
        .dynamic-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,200,100,0.06) 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: -1;
            animation: glowPulse 8s ease infinite;
        }
        @keyframes glowPulse {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        /* ===== 顶部导航 ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 48px;
            min-height: 48px;
            gap: 6px;
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .top-bar .brand .logo-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 170, 85, 0.15);
            border: 1px solid rgba(255, 170, 85, 0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffaa55;
            font-size: 12px;
        }
        .top-bar .brand .title {
            font-family: monospace;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .top-bar .brand .title span { color: #ffaa55; }
        .top-bar .brand .version-tag {
            background: rgba(255, 170, 85, 0.15);
            border: 1px solid rgba(255, 170, 85, 0.25);
            padding: 1px 6px;
            border-radius: 20px;
            font-size: 0.35rem;
            color: #ffaa55;
            font-family: monospace;
        }
        .top-bar .center-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 420px;
        }
        .top-bar .center-group .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px 0 0 4px;
            padding: 4px 10px;
            color: #ddd;
            font-family: monospace;
            font-size: 0.6rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            height: 28px;
            min-width: 50px;
            -webkit-appearance: none;
        }
        .top-bar .center-group .search-input:focus {
            border-color: #ffaa55;
            background: rgba(255, 255, 255, 0.08);
        }
        .top-bar .center-group .search-input::placeholder { color: #444; }
        .top-bar .center-group .search-btn {
            background: rgba(255, 170, 85, 0.12);
            border: 1px solid rgba(255, 170, 85, 0.2);
            border-radius: 0 4px 4px 0;
            padding: 4px 10px;
            color: #ffaa55;
            font-family: monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .top-bar .center-group .search-btn:hover {
            background: rgba(255, 170, 85, 0.25);
            border-color: rgba(255, 170, 85, 0.4);
        }
        .top-bar .center-group .search-btn:active { transform: scale(0.93); }
        .top-bar .center-group .search-btn i { font-size: 0.6rem; }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .top-bar .actions .btn-refresh {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 4px 14px;
            color: #aaa;
            font-family: monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
            height: 28px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .top-bar .actions .btn-refresh:hover {
            background: rgba(255, 170, 85, 0.12);
            border-color: rgba(255, 170, 85, 0.3);
            color: #ffaa55;
        }
        .top-bar .actions .btn-refresh:active { transform: scale(0.93); }
        .top-bar .actions .btn-refresh .badge-count {
            background: rgba(255, 170, 85, 0.15);
            color: #ffaa55;
            border-radius: 50%;
            padding: 0 5px;
            font-size: 0.45rem;
            min-width: 16px;
            text-align: center;
        }
        .top-bar .actions .btn-refresh i { font-size: 0.6rem; }
        .top-bar .actions .btn-refresh.spin i { animation: spin 0.8s ease-in-out; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .top-bar .actions .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 4px;
            color: #aaa;
            font-family: monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .top-bar .actions .btn-back:hover {
            background: rgba(255, 170, 85, 0.12);
            border-color: rgba(255, 170, 85, 0.3);
            color: #ffaa55;
        }
        .top-bar .actions .btn-back:active { transform: scale(0.88); }
        .top-bar .actions .btn-back i { font-size: 0.7rem; }

        .main-content {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 150px;
            min-width: 150px;
            max-width: 150px;
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255, 170, 85, 0.3); border-radius: 4px; }
        .sidebar .sidebar-label {
            font-size: 0.35rem;
            color: #444;
            font-family: monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 6px 2px 6px;
        }
        .sidebar .cat-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            border-radius: 4px;
            padding: 4px 6px;
            color: #888;
            font-family: monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            width: 100%;
            text-align: left;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .sidebar .cat-btn i {
            width: 12px;
            font-size: 0.55rem;
            color: #666;
            transition: color 0.2s;
        }
        .sidebar .cat-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        .sidebar .cat-btn:hover i { color: #ffaa55; }
        .sidebar .cat-btn.active {
            background: rgba(255, 170, 85, 0.12);
            color: #ffaa55;
            border-left: 2px solid #ffaa55;
        }
        .sidebar .cat-btn.active i { color: #ffaa55; }
        .sidebar .cat-btn .badge {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 5px;
            border-radius: 20px;
            font-size: 0.4rem;
            color: #555;
        }
        .sidebar .cat-btn.active .badge {
            background: rgba(255, 170, 85, 0.15);
            color: #ffaa55;
        }
        .sidebar .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 3px 4px;
        }
        .sidebar .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            border-radius: 4px;
            padding: 4px 6px;
            color: #888;
            font-family: monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            width: 100%;
            text-align: left;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .sidebar .action-btn i {
            width: 12px;
            font-size: 0.6rem;
            color: #666;
            transition: color 0.2s;
        }
        .sidebar .action-btn:hover {
            background: rgba(255, 170, 85, 0.12);
            color: #ffaa55;
        }
        .sidebar .action-btn:hover i { color: #ffaa55; }
        .sidebar .action-btn.primary { color: #ffaa55; }
        .sidebar .action-btn.primary i { color: #ffaa55; }
        .sidebar .action-btn.primary:hover { background: rgba(255, 170, 85, 0.2); }

        /* ===== 内容区 ===== */
        .content-area {
            flex: 1;
            padding: 10px 14px;
            overflow-y: auto;
            background: rgba(10, 10, 26, 0.3);
            height: 100%;
            min-width: 0;
            -webkit-overflow-scrolling: touch;
        }
        .content-area::-webkit-scrollbar { display: none; }
        .content-area { -ms-overflow-style: none; scrollbar-width: none; }

        .category-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }
        .category-header .cat-icon {
            width: 26px;
            height: 26px;
            background: rgba(255, 170, 85, 0.1);
            border: 1px solid rgba(255, 170, 85, 0.15);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffaa55;
            font-size: 12px;
            flex-shrink: 0;
        }
        .category-header .cat-info { flex: 1; min-width: 50px; }
        .category-header .cat-info h2 {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }
        .category-header .cat-info p {
            font-size: 0.4rem;
            color: #666;
            font-family: monospace;
            margin-top: 1px;
        }
        .category-header .cat-count {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.45rem;
            color: #888;
            font-family: monospace;
            white-space: nowrap;
        }

        /* ===== 模组网格 - PC端正方形 ===== */
        .mod-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }
        .mod-card {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            height: 0;
            background: rgba(30, 30, 45, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            cursor: pointer;
            overflow: hidden;
            touch-action: manipulation;
        }
        .mod-card:hover {
            border-color: rgba(255, 170, 85, 0.35);
            background: rgba(40, 40, 60, 0.6);
            transform: scale(1.02);
        }
        .mod-card:active { transform: scale(0.97); }
        .mod-card .mod-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-align: center;
            z-index: 1;
        }
        .mod-card .mod-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.5;
            z-index: 0;
            transition: opacity 0.3s;
        }
        .mod-card .mod-bg.no-image {
            background: #2a2a3a;
            opacity: 1;
        }
        .mod-card .mod-bg.no-image i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            opacity: 0.15;
            color: #888;
        }
        .mod-card:hover .mod-bg { opacity: 0.7; }
        .mod-card .mod-icon-wrap {
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ffaa55;
            margin-bottom: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .mod-card .mod-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mod-card .mod-icon-wrap i {
            font-size: 14px;
            color: #ffaa55;
        }
        .mod-card .mod-name {
            font-size: 0.5rem;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 95%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
        }
        .mod-card .mod-author {
            font-size: 0.32rem;
            color: #ccc;
            font-family: monospace;
            margin-top: 1px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }
        .mod-card .mod-author .avatar-small {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,170,85,0.2);
            flex-shrink: 0;
            background: #2a2a3a;
            display: inline-block;
        }
        .mod-card .mod-author .avatar-small.default {
            font-size: 7px;
            font-weight: bold;
            color: #ffaa55;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mod-card .mod-desc {
            font-size: 0.3rem;
            color: #ddd;
            font-family: monospace;
            margin-top: 1px;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 95%;
        }
        .mod-card .mod-meta {
            margin-top: 1px;
            font-size: 0.25rem;
            color: #aaa;
            font-family: monospace;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mod-card .mod-meta i {
            font-size: 0.25rem;
            color: #ffaa55;
        }
        .mod-card .mod-status-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.5rem;
            z-index: 5;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .mod-card .mod-status-badge i { font-size: 0.45rem; }
        .mod-card .mod-status-badge.danger { color: #4488ff; }
        .mod-card .mod-status-badge.warning { color: #44dd88; }
        .mod-card .mod-status-badge.orange { color: #ff8844; }
        .mod-card .mod-status-badge.gray { color: #888; }

        .mod-card .mod-actions {
            margin-top: 3px;
            display: flex;
            gap: 3px;
            width: 80%;
        }
        .mod-card .mod-actions button {
            flex: 1;
            padding: 2px 4px;
            border: none;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.3rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #ffaa55;
            border: 1px solid rgba(255, 170, 85, 0.15);
            touch-action: manipulation;
        }
        .mod-card .mod-actions .btn-download:hover { background: rgba(255, 170, 85, 0.25); }
        .mod-card .mod-actions .btn-download i { font-size: 0.25rem; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 16px;
            color: #444;
            font-family: monospace;
        }
        .empty-state i {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 0.55rem;
            color: #555;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .toast-container.visible {
            visibility: visible;
            opacity: 1;
        }
        .toast-container .toast-box {
            background: rgba(20, 20, 35, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 170, 85, 0.2);
            border-radius: 10px;
            padding: 12px 20px;
            color: #ffd966;
            font-family: monospace;
            font-size: 0.6rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 90%;
            text-align: center;
            transform: scale(0.92) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            line-height: 1.5;
        }
        .toast-container.visible .toast-box { transform: scale(1) translateY(0); }
        .toast-container .toast-box .toast-icon {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 3px;
        }
        .toast-container .toast-box .toast-msg { display: block; }
        .toast-container .toast-box .toast-sub {
            font-size: 0.4rem;
            color: #666;
            display: block;
            margin-top: 2px;
        }
        .toast-container .toast-box.error {
            border-color: rgba(255, 80, 80, 0.3);
            color: #ff8888;
        }
        .toast-container .toast-box.success {
            border-color: rgba(80, 255, 80, 0.2);
            color: #88dd88;
        }
        .toast-container .toast-box.warning {
            border-color: rgba(255, 200, 50, 0.2);
            color: #ffcc44;
        }

        /* ===== 上传进度条 ===== */
        .upload-progress {
            display: none;
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            height: 4px;
            overflow: hidden;
            position: relative;
        }
        .upload-progress.active { display: block; }
        .upload-progress .bar {
            height: 100%;
            background: #ffaa55;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        .upload-progress .label {
            font-size: 0.35rem;
            color: #888;
            font-family: monospace;
            margin-top: 2px;
            text-align: center;
        }

        /* ===== 检测弹窗 ===== */
        .check-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;

    <script>
        (function() {

            function getAccountEmail() {

                    'px;font-weight:bold;font-family:monospace;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,170,85,0.15);">DS</span>';
            }

            var currentCategory = 'prop';

            var commentsCache = {};

            var CATEGORY_NAMES = {

            var contentArea = document.getElementById('contentArea');

            function checkUploadPermission() {
                if (isGuestMode()) {
                    showToast('游客模式无法上传模组，请先登录邮箱', 'warning');

                    showToast('游客模式无法查看我的模组', 'warning');
                    return false;
                }

            }

            var menuAudio = null;

            function playMenuSound() {
                try {
                    if (!menuAudio) {
                        menuAudio = new Audio();

                        menuAudio.volume = 0.4;
                    }
                    menuAudio.currentTime = 0;
                    menuAudio.play().catch(function(e) {});
                } catch (e) {}
            }

            var toastContainer = document.getElementById('toastContainer');
            var toastBox = document.getElementById('toastBox');
            var toastIcon = document.getElementById('toastIcon');
            var toastMsg = document.getElementById('toastMsg');
            var toastSub = document.getElementById('toastSub');
            var toastTimer = null;

            function showToast(msg, type, sub, icon) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastContainer.classList.remove('visible');
                }
                toastBox.className = 'toast-box';
                if (type === 'success') toastBox.classList.add('success');
                else if (type === 'error') toastBox.classList.add('error');
                else if (type === 'warning') toastBox.classList.add('warning');
                toastIcon.innerHTML = icon || '<i class="fas fa-info-circle"></i>';
                toastMsg.textContent = msg;
                toastSub.textContent = sub || '';
                toastContainer.classList.add('visible');
                toastTimer = setTimeout(function() {
                    toastContainer.classList.remove('visible');
                    toastTimer = null;
                }, 3500);
            }

            toastContainer.addEventListener('click', function() {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastContainer.classList.remove('visible');
            });

            function shouldShowCheck() {
                var hasPassed = localStorage.getItem('workshop_check_passed');
                var checkTime = parseInt(localStorage.getItem('workshop_check_time') || '0');
                var isExpired = (Date.now() - checkTime) > 24 * 60 * 60 * 1000;
                if (hasPassed === 'true' && !isExpired) { return false; }
                return true;
            }

            function runEnvironmentCheck() {
                return new Promise(function(resolve) {
                    var items = {
                        token: { el: document.getElementById('checkToken'), pass: false },
                        network: { el: document.getElementById('checkNetwork'), pass: false },
                        repo: { el: document.getElementById('checkRepo'), pass: false },
                        mods: { el: document.getElementById('checkMods'), pass: false }
                    };

                    function updateItem(key, pass, msg) {
                        var item = items[key];
                        if (pass) {
                            item.el.className = 'status pass';
                            item.el.innerHTML = '<i class="fas fa-check-circle"></i>';
                            item.pass = true;
                        } else {
                            item.el.className = 'status fail';
                            item.el.innerHTML = '<i class="fas fa-times-circle"></i>';
                            item.pass = false;
                        }
                        if (msg) {
                            var parent = item.el.parentElement;
                            var textNode = parent.childNodes[parent.childNodes.length - 1];
                            if (textNode && textNode.nodeType === 3) {
                                parent.replaceChild(document.createTextNode(' ' + msg), textNode);
                            }
                        }
                    }

                    var tokenOk = GITHUB_TOKEN && GITHUB_TOKEN.length > 10 && GITHUB_TOKEN !== '你的GitHub Token';
                    updateItem('token', tokenOk, tokenOk ? '已配置' : '未配置或无效');
                    var networkOk = navigator.onLine !== false;
                    updateItem('network', networkOk, networkOk ? '已连接' : '未连接');

                    var repoUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO;
                    fetch(repoUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
                        .then(function(res) {
                            var repoOk = res.status === 200;
                            updateItem('repo', repoOk, repoOk ? '可访问' : '状态码 ' + res.status);
                            return res.status === 200;
                        })
                        .catch(function() { updateItem('repo', false, '访问失败'); return false; })
                        .then(function(repoOk) {
                            if (!repoOk) { resolve(false); return; }
                            var modsUrl = CDN_BASE + '/mods.json';
                            return fetch(modsUrl, { cache: 'no-store' })
                                .then(function(res) {
                                    var modsOk = res.status === 200;
                                    updateItem('mods', modsOk, modsOk ? '已存在' : '不存在或无法读取');
                                    return modsOk;
                                })
                                .catch(function() { updateItem('mods', false, '无法读取'); return false; });
                        })
                        .then(function(allPass) { resolve(allPass); });
                });
            }

            function showCheckModal() {
                if (!shouldShowCheck()) {
                    initWorkshop();
                    return;
                }
                checkOverlay.classList.add('active');
                checkStartBtn.innerHTML = '<i class="fas fa-play"></i> 开始检测';
                checkStartBtn.disabled = false;

                var items = ['checkToken', 'checkNetwork', 'checkRepo', 'checkMods'];
                items.forEach(function(id) {
                    var el = document.getElementById(id);
                    el.className = 'status';
                    el.innerHTML = '<i class="fas fa-hourglass-half"></i>';
                    var parent = el.parentElement;
                    var textNode = parent.childNodes[parent.childNodes.length - 1];
                    if (textNode && textNode.nodeType === 3) {
                        var label = textNode.textContent.trim();
                        parent.replaceChild(document.createTextNode(' ' + label), textNode);
                    }
                });

                checkStartBtn.onclick = function() {
                    checkStartBtn.disabled = true;
                    checkStartBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中...';
                    runEnvironmentCheck().then(function(passed) {
                        checkPassed = passed;
                        checkStartBtn.disabled = false;
                        if (passed) {
                            localStorage.setItem('workshop_check_passed', 'true');
                            localStorage.setItem('workshop_check_time', String(Date.now()));
                            checkStartBtn.innerHTML = '<i class="fas fa-check"></i> 全部通过，进入创意工坊';
                            showToast('环境检测通过', 'success', '正在加载创意工坊', '<i class="fas fa-shield-alt"></i>');
                            setTimeout(function() {
                                checkOverlay.classList.remove('active');
                                initWorkshop();
                            }, 800);
                        } else {
                            checkStartBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 检测未通过，重试';
                            showToast('部分检测未通过', 'error', '请检查配置后重试', '<i class="fas fa-exclamation-triangle"></i>');
                        }
                    });
                };
            }

            function scanAllFolders() {
                var folders = ['mods', 'icons', 'previews'];
                var promises = folders.map(function(folder) {
                    var url = GITHUB_API + '/' + folder;
                    return fetch(url, {
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    })
                    .then(function(res) {
                        if (!res.ok) { return {}; }
                        return res.json();
                    })
                    .then(function(files) {
                        if (!Array.isArray(files)) return {};
                        var result = {};
                        files.forEach(function(f) {
                            if (f.type === 'file') {
                                var name = f.name;
                                if (folder === 'mods' && name.endsWith('.zip')) {
                                    result[name.replace('.zip', '')] = {
                                        exists: true,
                                        size: f.size || 0,
                                        sha: f.sha || null,
                                        name: name
                                    };
                                } else if (folder === 'icons' || folder === 'previews') {
                                    result[name] = {
                                        exists: true,
                                        size: f.size || 0,
                                        sha: f.sha || null
                                    };
                                }
                            }
                        });
                        return result;
                    })
                    .catch(function() { return {}; });
                });

                return Promise.all(promises).then(function(results) {
                    folderScanCache = {
                        zips: results[0] || {},
                        icons: results[1] || {},
                        previews: results[2] || {}
                    };
                    return folderScanCache;
                });
            }

            function fetchModsJsonFromAPI() {
                return fetch(GITHUB_API + '/mods.json', {
                    headers: {
                        'Authorization': 'token ' + GITHUB_TOKEN,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    cache: 'no-store'
                })
                .then(function(res) {
                    if (res.status === 200) { return res.json(); }
                    throw new Error('API 返回 ' + res.status);
                })
                .then(function(data) {
                    if (data && data.content) {
                        var decoded = decodeURIComponent(escape(atob(data.content)));
                        return JSON.parse(decoded);
                    }
                    throw new Error('API 数据无效');
                })
                .catch(function() {
                    return fetch(CDN_BASE + '/mods.json?_=' + Date.now(), { cache: 'no-store' })
                        .then(function(res) {
                            if (res.ok) return res.json();
                            return { mods: [] };
                        });
                });
            }

            function verifyModFiles(mod) {
                var zipExists = false;
                var iconExists = false;
                var previewExists = false;

                if (mod.id && folderScanCache.zips[mod.id]) { zipExists = true; }
                if (mod._scanned && mod.id && folderScanCache.zips[mod.id]) { zipExists = true; }

                var iconExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.gif'];
                if (mod.iconUrl) {
                    var iconFileName = mod.iconUrl.split('/').pop();
                    if (iconFileName && folderScanCache.icons[iconFileName]) { iconExists = true; }
                }
                if (!iconExists && mod.id) {
                    for (var i = 0; i < iconExtensions.length; i++) {
                        var ext = iconExtensions[i];
                        if (folderScanCache.icons[mod.id + ext]) {
                            iconExists = true;
                            mod.iconUrl = CDN_BASE + '/icons/' + mod.id + ext;
                            break;
                        }
                    }
                }

                var previewExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                if (mod.previewUrl) {
                    var previewFileName = mod.previewUrl.split('/').pop();
                    if (previewFileName && folderScanCache.previews[previewFileName]) { previewExists = true; }
                }
                if (!previewExists && mod.id) {
                    for (var i = 0; i < previewExtensions.length; i++) {
                        var ext = previewExtensions[i];
                        if (folderScanCache.previews[mod.id + ext]) {
                            previewExists = true;
                            mod.previewUrl = CDN_BASE + '/previews/' + mod.id + ext;
                            break;
                        }
                    }
                }

                return { zipExists: zipExists, iconExists: iconExists, previewExists: previewExists };
            }

            function getDisplayImages(mod) {
                var t = Date.now();
                var iconUrl = mod.iconUrl || null;
                var previewUrl = mod.previewUrl || null;
                if (iconUrl && !previewUrl) { previewUrl = iconUrl; }
                if (!iconUrl && previewUrl) { iconUrl = previewUrl; }
                if (iconUrl) iconUrl = iconUrl + (iconUrl.indexOf('?') === -1 ? '?t=' + t : '&t=' + t);
                if (previewUrl) previewUrl = previewUrl + (previewUrl.indexOf('?') === -1 ? '?t=' + t : '&t=' + t);
                return { iconUrl: iconUrl, previewUrl: previewUrl };
            }

            function getAbnormalStatus(mod) {
                var verified = verifyModFiles(mod);
                mod._zipExists = verified.zipExists;
                mod._iconExists = verified.iconExists;
                mod._previewExists = verified.previewExists;

                if (!mod.name || mod.name.trim() === '') {
                    return { type: 'danger', icon: 'fa-info-circle', label: '无名称', detail: '模组名称为空' };
                }
                if (!verified.zipExists) {
                    return { type: 'warning', icon: 'fa-exclamation-triangle', label: '无模组文件', detail: 'ZIP 文件不存在' };
                }
                if (!verified.iconExists && !verified.previewExists) {
                    return { type: 'orange', icon: 'fa-exclamation-circle', label: '缺少图片资源', detail: '请上传图标或预览图' };
                }
                return null;
            }

            function isNormalMod(mod) { return getAbnormalStatus(mod) === null; }

            function mergeModsData(apiData) {
                var result = [];
                var processedIds = [];

                var apiMods = [];
                if (apiData && apiData.mods) {
                    if (Array.isArray(apiData.mods)) { apiMods = apiData.mods; } 
                    else if (typeof apiData.mods === 'object') { apiMods = Object.values(apiData.mods); }
                }

                apiMods.forEach(function(mod) {
                    if (!mod.id) return;
                    var processed = {
                        id: mod.id,
                        name: mod.name || mod.id,
                        author: mod.author || '未知',
                        authorEmail: mod.authorEmail || null,
                        category: String(mod.category || 'other'),
                        description: mod.description || '暂无描述',
                        version: mod.version || '1.0.0',
                        fileSize: mod.fileSize || 0,
                        downloadCount: mod.downloadCount || 0,

                        downloadUrl: mod.downloadUrl || (CDN_BASE + '/mods/' + mod.id + '.zip'),
                        iconUrl: mod.iconUrl || null,
                        previewUrl: mod.previewUrl || null,
                        _fromAPI: true
                    };
                    var verified = verifyModFiles(processed);
                    processed._zipExists = verified.zipExists;
                    processed._iconExists = verified.iconExists;
                    processed._previewExists = verified.previewExists;
                    result.push(processed);
                    processedIds.push(mod.id);
                });

                Object.keys(folderScanCache.zips).forEach(function(zipId) {
                    if (!processedIds.includes(zipId)) {
                        var category = 'other';
                        var nameParts = zipId.split('_');
                        if (nameParts.length > 1) {
                            var prefix = nameParts[0].toLowerCase();
                            if (['prop', 'creature', 'vehicle', 'weapon', 'test', 'other'].includes(prefix)) {
                                category = prefix;
                            }
                        }
                        var iconFile = null,
                            previewFile = null;
                        var iconExts = ['.png', '.jpg', '.jpeg', '.webp', '.gif'];
                        var previewExts = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                        for (var i = 0; i < iconExts.length; i++) {
                            if (folderScanCache.icons[zipId + iconExts[i]]) { iconFile = zipId + iconExts[i]; break; }
                        }
                        for (var i = 0; i < previewExts.length; i++) {
                            if (folderScanCache.previews[zipId + previewExts[i]]) { previewFile = zipId + previewExts[i]; break; }
                        }
                        result.push({
                            id: zipId,
                            name: zipId,
                            author: '自动恢复',
                            authorEmail: null,
                            category: category,
                            description: '从 mods/ 文件夹自动恢复，请完善信息',
                            version: '1.0.0',
                            fileSize: folderScanCache.zips[zipId].size || 0,
                            downloadCount: 0,
                            uploadedAt: new Date().toISOString(),
                            downloadUrl: CDN_BASE + '/mods/' + zipId + '.zip',
                            iconUrl: iconFile ? CDN_BASE + '/icons/' + iconFile : null,
                            previewUrl: previewFile ? CDN_BASE + '/previews/' + previewFile : null,
                            _scanned: true,
                            _zipExists: true,
                            _iconExists: !!iconFile,
                            _previewExists: !!previewFile
                        });
                        processedIds.push(zipId);
                    }
                });

                return result;
            }

            function uploadToGitHubWithProgress(file, filePath, onProgress) {
                return new Promise(function(resolve, reject) {
                    var reader = new FileReader();
                    reader.onprogress = function(e) {
                        if (onProgress && e.total > 0) {
                            onProgress(Math.round((e.loaded / e.total) * 100));
                        }
                    };
                    reader.onload = function(e) {
                        var base64 = e.target.result.split(',')[1];
                        var url = GITHUB_API + '/' + encodeURIComponent(filePath);
                        fetch(url, {
                            headers: {
                                'Authorization': 'token ' + GITHUB_TOKEN,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        })
                        .then(function(res) {
                            return res.json().then(function(data) {
                                return { status: res.status, data: data };
                            });
                        })
                        .then(function(result) {
                            var sha = null;
                            if (result.status === 200 && result.data && result.data.sha) {
                                sha = result.data.sha;
                            }
                            var body = {
                                message: '上传模组文件: ' + filePath,
                                content: base64,
                                branch: 'main'
                            };
                            if (sha) body.sha = sha;
                            return fetch(url, {
                                method: 'PUT',
                                headers: {
                                    'Authorization': 'token ' + GITHUB_TOKEN,
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/vnd.github.v3+json'
                                },
                                body: JSON.stringify(body)
                            });
                        })
                        .then(function(res) {
                            if (!res.ok) {
                                return res.text().then(function(text) {
                                    var errorMsg = '上传失败: ' + res.status;
                                    try { var json = JSON.parse(text); if (json.message) errorMsg = json.message; } catch (
                                    e) {}
                                    throw new Error(errorMsg);
                                });
                            }
                            if (onProgress) onProgress(100);
                            return res.json();
                        })
                        .then(function(data) { resolve(data); })
                        .catch(function(err) { reject(err); });
                    };
                    reader.readAsDataURL(file);
                });
            }

            function updateModsJson(newMod) {
                var url = GITHUB_API + '/mods.json';
                return fetch(url, {
                    headers: {

                        'Accept': 'application/vnd.github.v3+json'

                .then(function(res) {
                    if (res.status === 200) { return res.json(); }
                    return null;
                })
                .then(function(existingData) {
                    var allExistingMods = [];
                    var sha = null;
                    if (existingData) {
                        sha = existingData.sha;
                        if (existingData.content) {
                            try {
                                var decoded = decodeURIComponent(escape(atob(existingData.content)));
                                var parsed = JSON.parse(decoded);
                                if (parsed && parsed.mods) {
                                    if (Array.isArray(parsed.mods)) { allExistingMods = parsed.mods; } 
                                    else if (typeof parsed.mods === 'object') { allExistingMods = Object.values(parsed.mods); }
                                }
                            } catch (e) { allExistingMods = []; }
                        }
                    }

                    var exists = false;
                    for (var i = 0; i < allExistingMods.length; i++) {
                        if (allExistingMods[i].id === newMod.id) {
                            allExistingMods[i] = newMod;
                            exists = true;
                            break;

                    }
                    if (!exists) { allExistingMods.push(newMod); }

                    var data = {

                        updatedAt: new Date().toISOString(),
                        mods: allExistingMods,

                            test: { name: '测试类', icon: 'fa-flask' },
                            other: { name: '特殊类', icon: 'fa-music' }
                        }

                    var jsonString = JSON.stringify(data, null, 2);
                    var base64 = btoa(unescape(encodeURIComponent(jsonString)));
                    var body = {
                        message: (exists ? '更新' : '追加') + '模组: ' + newMod.name + ' (ID: ' + newMod.id + ')',
                        content: base64,
                        branch: 'main'
                    };
                    if (sha) body.sha = sha;

                    return fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify(body)
                    });
                })
                .then(function(res) {
                    if (!res.ok) {
                        return res.text().then(function(text) {
                            var errorMsg = '更新失败: ' + res.status;
                            try { var json = JSON.parse(text); if (json.message) errorMsg = json.message; } catch (e) {}
                            throw new Error(errorMsg);
                        });
                    }
                    return res.json();
                });
            }

            function deleteModFromGitHub(modId) {
                return new Promise(function(resolve, reject) {
                    var mod = allMods.find(function(m) { return m.id === modId; });
                    if (!mod) { reject(new Error('模组不存在')); return; }

                    var filesToDelete = [
                        'mods/' + modId + '.zip',
                        'icons/' + modId + '.png',
                        'icons/' + modId + '.jpg',
                        'icons/' + modId + '.webp',
                        'previews/' + modId + '.jpg',
                        'previews/' + modId + '.png',
                        'previews/' + modId + '.webp'
                    ];

                    var deletePromises = filesToDelete.map(function(filePath) {
                        var url = GITHUB_API + '/' + encodeURIComponent(filePath);
                        return fetch(url, {
                            headers: {
                                'Authorization': 'token ' + GITHUB_TOKEN,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        })
                        .then(function(res) {
                            if (res.status === 200) {
                                return res.json().then(function(data) {
                                    if (data && data.sha) {
                                        return fetch(url, {
                                            method: 'DELETE',
                                            headers: {
                                                'Authorization': 'token ' + GITHUB_TOKEN,
                                                'Accept': 'application/vnd.github.v3+json'
                                            },
                                            body: JSON.stringify({
                                                message: '删除模组文件: ' + filePath,
                                                sha: data.sha,
                                                branch: 'main'
                                            })
                                        });
                                    }
                                    return null;
                                });
                            }
                            return null;
                        })
                        .catch(function() { return null; });
                    });

                    Promise.all(deletePromises)
                        .then(function() {
                            var idx = allMods.findIndex(function(m) { return m.id === modId; });
                            if (idx !== -1) { allMods.splice(idx, 1); }
                            return updateModsJsonForDelete(modId);
                        })
                        .then(function() {
                            resolve();
                        })
                        .catch(function(err) {
                            reject(err);
                        });
                });
            }

            function waitForGitHubSync(modId, fileType, maxRetries, delay) {
                maxRetries = maxRetries || 10;
                delay = delay || 1500;
                var folder = fileType === 'zip' ? 'mods' : (fileType === 'icon' ? 'icons' : 'previews');
                var fileName = fileType === 'zip' ? modId + '.zip' :
                    (fileType === 'icon' ? modId + '.png' : modId + '.jpg');

                return new Promise(function(resolve) {
                    var attempts = 0;

                    function check() {
                        attempts++;
                        var url = GITHUB_API + '/' + folder + '/' + encodeURIComponent(fileName);
                        fetch(url, {
                            headers: {
                                'Authorization': 'token ' + GITHUB_TOKEN,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        })
                        .then(function(res) {
                            if (res.status === 200) { resolve(true); } 
                            else if (attempts >= maxRetries) { resolve(false); } 
                            else { setTimeout(check, delay); }
                        })
                        .catch(function() {
                            if (attempts >= maxRetries) { resolve(false); } 
                            else { setTimeout(check, delay); }
                        });
                    }
                    check();
                });
            }

                    var count = 0;

                    else {

                            return String(m.category) === String(cat) && isNormalMod(m);

                var abnormalCount = filteredMods.filter(function(m) { return !isNormalMod(m); }).length;
                if (abnormalBadge) { abnormalBadge.textContent = abnormalCount; }

            function renderComments(modId) {

                var list = document.getElementById('commentList');

                if (comments.length === 0) {
                    list.innerHTML =
                        '<div class="no-comments"><i class="fas fa-comment-slash" style="margin-right:4px;"></i>暂无评论</div>';
                    return;
                }

                var html = '';
                for (var i = comments.length - 1; i >= 0; i--) {
                    var c = comments[i];
                    var isOwn = c.authorEmail && c.authorEmail === currentEmail;
                    var avatarHtml = getAvatarHtml(c.authorEmail || null, 18);

                    html += `
                        <div class="comment-item ${isOwn ? 'own-comment' : ''}" data-index="${i}">
                            <div class="comment-avatar">${avatarHtml}</div>
                            <div class="comment-body">
                                <span class="comment-name">${c.author}</span>
                                <div class="comment-text">${c.content}</div>

                    if (c.replies && c.replies.length > 0) {
                        for (var j = c.replies.length - 1; j >= 0; j--) {
                            var r = c.replies[j];
                            var rIsOwn = r.authorEmail && r.authorEmail === currentEmail;
                            var rAvatarHtml = getAvatarHtml(r.authorEmail || null, 14);
                            html += `
                                <div class="reply-item comment-item ${rIsOwn ? 'own-comment' : ''}">
                                    <div class="comment-avatar">${rAvatarHtml}</div>
                                    <div class="comment-body">
                                        <span class="comment-name">${r.author}</span>
                                        <span class="reply-to-author">@${c.author}</span>
                                        <div class="comment-text">${r.content}</div>
                                        <div class="comment-actions">
                                            <button class="reply-btn" data-parent="${i}" data-reply="${j}"><i class="fas fa-reply"></i> 回复</button>
                                        </div>
                                        <div class="reply-input-wrapper" id="replyWrapper_${i}_${j}">
                                            <input type="text" class="reply-input" placeholder="回复 ${r.author}..." maxlength="200">
                                            <button class="reply-send" data-parent="${i}" data-reply="${j}">发送</button>
                                        </div>
                                    </div>
                                    <span class="comment-time">${r.time || ''}</span>
                                    ${rIsOwn ? '<button class="delete-comment-btn" data-parent="'+i+'" data-reply="'+j+'"><i class="fas fa-trash"></i></button>' : ''}
                                </div>
                            `;
                        }
                    }

                    html += `
                                </div>
                            </div>
                            <span class="comment-time">${c.time || ''}</span>
                            ${isOwn ? '<button class="delete-comment-btn" data-index="'+i+'"><i class="fas fa-trash"></i></button>' : ''}
                        </div>
                    `;
                }
                list.innerHTML = html;

                list.querySelectorAll('.reply-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var parentIdx = btn.getAttribute('data-parent') || btn.getAttribute('data-index');
                        var replyIdx = btn.getAttribute('data-reply');
                        var wrapperId = replyIdx !== null ? 'replyWrapper_' + parentIdx + '_' + replyIdx :
                            'replyWrapper_' + parentIdx;
                        var wrapper = document.getElementById(wrapperId);
                        if (wrapper) {
                            wrapper.classList.toggle('active');
                            wrapper.querySelector('.reply-input').focus();
                        }
                    });
                });

                list.querySelectorAll('.reply-send').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var parentIdx = btn.getAttribute('data-parent') || btn.getAttribute('data-index');
                        var replyIdx = btn.getAttribute('data-reply');
                        var wrapperId = replyIdx !== null ? 'replyWrapper_' + parentIdx + '_' + replyIdx :
                            'replyWrapper_' + parentIdx;
                        var wrapper = document.getElementById(wrapperId);
                        var input = wrapper ? wrapper.querySelector('.reply-input') : null;
                        if (input && input.value.trim()) {
                            var content = input.value.trim();
                            var targetAuthor = null;
                            var comment = comments[parseInt(parentIdx)];
                            if (comment) {
                                if (replyIdx !== null && comment.replies && comment.replies[parseInt(replyIdx)]) {
                                    targetAuthor = comment.replies[parseInt(replyIdx)].author;
                                } else {
                                    targetAuthor = comment.author;
                                }
                            }
                            addReply(modId, parseInt(parentIdx), replyIdx !== null ? parseInt(replyIdx) : null, content,
                                targetAuthor);
                            input.value = '';
                            wrapper.classList.remove('active');
                        }
                    });
                });

                list.querySelectorAll('.reply-input').forEach(function(input) {
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            var wrapper = input.closest('.reply-input-wrapper');
                            var btn = wrapper ? wrapper.querySelector('.reply-send') : null;
                            if (btn) btn.click();

                });

                list.querySelectorAll('.delete-comment-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var index = btn.getAttribute('data-index');
                        var parent = btn.getAttribute('data-parent');
                        var reply = btn.getAttribute('data-reply');
                        if (index !== null) {
                            showDeleteConfirm(modId, parseInt(index));
                        } else if (parent !== null && reply !== null) {
                            showDeleteReplyConfirm(modId, parseInt(parent), parseInt(reply));
                        }
                    });
                });

                list.querySelectorAll('.comment-item.own-comment').forEach(function(item) {
                    var longPressTimer = null;
                    var index = item.getAttribute('data-index');
                    var parent = item.getAttribute('data-parent');
                    var reply = item.getAttribute('data-reply');
                    item.addEventListener('touchstart', function(e) {
                        longPressTimer = setTimeout(function() {
                            if (index !== null) {
                                showDeleteConfirm(modId, parseInt(index));
                            } else if (parent !== null && reply !== null) {
                                showDeleteReplyConfirm(modId, parseInt(parent), parseInt(reply));
                            }
                        }, 600);
                    }, { passive: true });
                    item.addEventListener('touchend', function() { clearTimeout(longPressTimer); }, { passive: true });
                    item.addEventListener('touchmove', function() { clearTimeout(longPressTimer); }, { passive: true });
                    item.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        if (index !== null) {
                            showDeleteConfirm(modId, parseInt(index));
                        } else if (parent !== null && reply !== null) {
                            showDeleteReplyConfirm(modId, parseInt(parent), parseInt(reply));
                        }
                    });
                });
            }

            function showDeleteConfirm(modId, commentIndex) {
                var overlay = document.getElementById('deleteConfirmOverlay');
                var msg = document.getElementById('deleteConfirmMsg');
                msg.textContent = '确定要删除这条评论吗？';

                document.getElementById('deleteConfirmOk').onclick = function() {
                    overlay.classList.remove('active');
                    deleteComment(modId, commentIndex);
                };
                overlay.onclick = function(e) {
                    if (e.target === overlay) { overlay.classList.remove('active'); }
                };
            }

            function showDeleteReplyConfirm(modId, commentIndex, replyIndex) {
                var overlay = document.getElementById('deleteConfirmOverlay');
                var msg = document.getElementById('deleteConfirmMsg');
                msg.textContent = '确定要删除这条回复吗？';
                overlay.classList.add('active');
                document.getElementById('deleteConfirmCancel').onclick = function() { overlay.classList.remove('active'); };
                document.getElementById('deleteConfirmOk').onclick = function() {
                    overlay.classList.remove('active');
                    deleteReply(modId, commentIndex, replyIndex);
                };
                overlay.onclick = function(e) {
                    if (e.target === overlay) { overlay.classList.remove('active'); }
                };
            }

            function deleteComment(modId, commentIndex) {
                if (!commentsCache[modId]) return;
                if (commentIndex < 0 || commentIndex >= commentsCache[modId].length) return;
                var currentEmail = getAccountEmail();
                var comment = commentsCache[modId][commentIndex];
                if (!comment.authorEmail || comment.authorEmail !== currentEmail) {
                    showToast('不能删除别人的评论', 'error');
                    return;
                }
                commentsCache[modId].splice(commentIndex, 1);
                if (commentsCache[modId].length === 0) { delete commentsCache[modId]; }
                renderComments(modId);
                saveCommentsToGitHub();
                showToast('评论已删除', 'success');
                playMenuSound();
            }

            function deleteReply(modId, commentIndex, replyIndex) {
                if (!commentsCache[modId]) return;
                if (commentIndex < 0 || commentIndex >= commentsCache[modId].length) return;
                var comment = commentsCache[modId][commentIndex];
                if (!comment.replies || replyIndex < 0 || replyIndex >= comment.replies.length) return;
                var currentEmail = getAccountEmail();
                var reply = comment.replies[replyIndex];
                if (!reply.authorEmail || reply.authorEmail !== currentEmail) {
                    showToast('不能删除别人的回复', 'error');
                    return;
                }
                comment.replies.splice(replyIndex, 1);
                if (comment.replies.length === 0) { delete comment.replies; }
                renderComments(modId);
                saveCommentsToGitHub();
                showToast('回复已删除', 'success');
                playMenuSound();
            }

            function addReply(modId, commentIndex, replyIndex, content, targetAuthor) {
                if (!commentsCache[modId]) { commentsCache[modId] = []; }
                if (commentIndex < 0 || commentIndex >= commentsCache[modId].length) { return; }
                var comment = commentsCache[modId][commentIndex];
                var currentUser = getAccountName();
                var currentEmail = getAccountEmail();

                var replyData = {
                    author: currentUser,
                    authorEmail: currentEmail,
                    content: content,
                    time: new Date().toLocaleString()
                };

                if (!comment.replies) { comment.replies = []; }
                comment.replies.push(replyData);

                renderComments(modId);
                saveCommentsToGitHub();

                var targetEmail = comment.authorEmail || null;
                if (targetEmail && targetEmail !== currentEmail) {
                    sendNotification(targetEmail, 'reply', currentUser, modId, null, content);
                }

                showToast('回复已发送', 'success');
                playMenuSound();
            }

            function addComment(modId) {
                var input = document.getElementById('commentInput');
                var text = input.value.trim();
                if (!text) { showToast('请输入评论内容', 'warning'); return; }
                if (text.length > 500) { showToast('评论不能超过500字', 'warning'); return; }

                var currentUser = getAccountName();
                var currentEmail = getAccountEmail();

                if (!commentsCache[modId]) commentsCache[modId] = [];
                commentsCache[modId].push({
                    author: currentUser,
                    authorEmail: currentEmail,
                    content: text,
                    time: new Date().toLocaleString(),
                    replies: []
                });

                input.value = '';
                renderComments(modId);
                saveCommentsToGitHub();

                var mod = allMods.find(function(m) { return m.id === modId; });
                if (mod && mod.authorEmail && mod.authorEmail !== currentEmail) {
                    sendNotification(mod.authorEmail, 'comment', currentUser, modId, mod.name, text);
                }

                showToast('评论已发送', 'success');
                playMenuSound();
            }

            document.getElementById('commentSubmitBtn').addEventListener('click', function() {
                if (currentDetailMod) { addComment(currentDetailMod.id); }
            });
            document.getElementById('commentInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (currentDetailMod) { addComment(currentDetailMod.id); }
                }
            });

            function sendNotification(targetEmail, type, from, modId, modName, content) {
                if (!targetEmail || targetEmail === 'guest') return Promise.resolve();

                var url = GITHUB_API + '/notifications.json';
                return fetch(url, {
                    headers: {
                        'Authorization': 'token ' + GITHUB_TOKEN,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(function(res) {
                    if (res.status === 404) {
                        return { notifications: {} };
                    }
                    if (!res.ok) return { notifications: {} };
                    return res.json();
                })
                .then(function(data) {
                    var allNotifs = {};
                    var sha = null;
                    if (data && data.content) {
                        try {
                            var decoded = decodeURIComponent(escape(atob(data.content)));
                            allNotifs = JSON.parse(decoded);
                            sha = data.sha;
                        } catch (e) {
                            allNotifs = {};
                        }
                    }

                    if (!allNotifs[targetEmail]) {
                        allNotifs[targetEmail] = { unread: 0, items: [] };
                    }

                    allNotifs[targetEmail].items.push({
                        id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        type: type,
                        from: from,
                        modId: modId,
                        modName: modName || '未知模组',
                        content: content || '',
                        time: new Date().toISOString(),
                        read: false
                    });
                    allNotifs[targetEmail].unread = (allNotifs[targetEmail].unread || 0) + 1;

                    var jsonString = JSON.stringify(allNotifs, null, 2);
                    var base64 = btoa(unescape(encodeURIComponent(jsonString)));
                    var body = {
                        message: '新通知: ' + type + ' from ' + from,
                        content: base64,
                        branch: 'main'
                    };
                    if (sha) body.sha = sha;

                    return fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify(body)
                    });
                })
                .catch(function(err) {
                    console.warn('[Workshop] 发送通知失败:', err);
                });
            }

            function setupFileDrop(zoneId, inputId, displayId, progressId, progressBarId, progressLabelId) {
                var zone = document.getElementById(zoneId);
                var input = document.getElementById(inputId);
                var display = document.getElementById(displayId);
                var progress = document.getElementById(progressId);
                var progressBar = document.getElementById(progressBarId);
                var progressLabel = document.getElementById(progressLabelId);

                if (!zone || !input || !display) return;

                var fileKey = inputId === 'modFile' ? 'zip' : (inputId === 'iconFile' ? 'icon' : 'preview');

                input.addEventListener('change', function(e) {
                    var file = input.files[0];
                    if (file) {
                        selectedFiles[fileKey] = file;
                        var sizeKB = (file.size / 1024).toFixed(0);
                        var sizeMB = (file.size / 1024 / 1024).toFixed(1);
                        var sizeDisplay = file.size > 1024 * 1024 ? sizeMB + ' MB' : sizeKB + ' KB';
                        display.textContent = file.name + ' (' + sizeDisplay + ')';
                        display.style.color = '#88dd88';
                        display.style.fontWeight = 'bold';
                    } else {
                        selectedFiles[fileKey] = null;
                        display.textContent = '未选择文件';
                        display.style.color = '#88dd88';
                        display.style.fontWeight = 'normal';
                    }
                    if (progress) {
                        progress.classList.remove('active');
                        progressBar.style.width = '0%';
                        if (progressLabel) progressLabel.textContent = '0%';
                    }
                });

                zone.addEventListener('click', function(e) {
                    if (e.target.closest('button') || e.target.closest('a') || e.target.tagName === 'INPUT') {
                        e.stopPropagation();
                        return;
                    }
                    var wrapper = e.target.closest('.file-input-wrapper');
                    if (wrapper) {
                        var fileInput = wrapper.querySelector('input[type="file"]');
                        if (fileInput) {
                            fileInput.click();
                        }
                        e.stopPropagation();
                        return;
                    }
                });

                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    zone.classList.add('dragover');
                });
                zone.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                });
                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                    var files = e.dataTransfer.files;
                    if (files.length > 0) {
                        input.files = files;
                        var event = new Event('change', { bubbles: true });
                        input.dispatchEvent(event);
                    }
                });
            }

            setupFileDrop('fileDropZone', 'modFile', 'uploadFileName', 'zipProgress', 'zipProgressBar', 'zipProgressLabel');
            setupFileDrop('iconDropZone', 'iconFile', 'uploadIconName', 'iconProgress', 'iconProgressBar',
                'iconProgressLabel');

                'previewProgressLabel');
